# Load balancer for athora.
#
# Scope, stated plainly: this spreads HTTP across API replicas and survives one
# replica dying. It does NOT raise the ceiling on AI generation — that ceiling is
# the LLM provider's rate limit, enforced by a single worker replica on purpose
# (see ai-generation.processor.ts). Adding replicas here does not make mind maps
# generate faster, and it is not supposed to.

worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The SSE endpoint holds a connection open for the whole answer, so the log
  # line only lands at the end. $request_time is what tells you a stream stalled.
  log_format  lb  '$remote_addr $status $request_time "$request" -> $upstream_addr';
  access_log  /var/log/nginx/access.log  lb;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  server_tokens   off;

  # Compress API payloads. Explicitly NOT text/event-stream: gzip buffers to fill
  # a compression window, which is exactly the stall this config exists to avoid.
  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types        application/json application/javascript text/css text/plain
                    image/svg+xml application/x-font-ttf font/woff2;

  # least_conn, not round-robin. Requests here are wildly uneven — a chat stream
  # occupies a connection for minutes while a GET /sessions returns in 20ms. Round
  # robin counts both as one request and piles streams onto a replica that is
  # already holding several.
  upstream api {
    least_conn;
    server backend-api-1:3001 max_fails=3 fail_timeout=15s;
    server backend-api-2:3001 max_fails=3 fail_timeout=15s;
    keepalive 64;
  }

  upstream web {
    least_conn;
    server web-1:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # 50MB matches the PDF limit the upload dialog advertises. Left at nginx's
    # 1MB default, every upload over 1MB dies at the proxy with a 413 before it
    # ever reaches NestJS.
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── AI tutor chat: SSE ────────────────────────────────────────────────────
    # chat.controller.ts sets Content-Type: text/event-stream. Three settings are
    # load-bearing and all three have wrong defaults:
    #   proxy_buffering on  → nginx holds the response until its buffer fills, so
    #     the user watches a dead screen and then gets the whole answer at once.
    #     This is the single most likely way to "add a load balancer" and have
    #     chat appear broken while every health check stays green.
    #   proxy_read_timeout 60s → a model thinking longer than 60s between tokens
    #     gets the connection cut mid-answer.
    #   Connection: upgrade (inherited) → wrong for SSE, which is plain HTTP.
    location /chat {
      proxy_pass http://api;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      chunked_transfer_encoding on;
      proxy_set_header Connection '';
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    location /api {
      proxy_pass http://api;
      proxy_read_timeout 120s;
    }

    # Health endpoint for the LB's own use — kept unbuffered and un-logged noise-free.
    location /health {
      proxy_pass http://api;
      proxy_read_timeout 5s;
      access_log off;
    }

    location / {
      proxy_pass http://web;
      proxy_read_timeout 60s;
    }
  }
}
